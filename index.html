<!DOCTYPE html>
<html lang="en">
<!--
  =====================================================================
  THE HEIST - Team 7 terminal (REM escape room, Money Heist dream)
  Course: Designing Connected Experiences, TU/e
  =====================================================================

  This page is the terminal of the Money Heist dream. When it opens, it
  connects to OOCSI (oocsi.id.tue.nl) and joins the team 7 teamspace as
  an OOCSI Thing called "heist-terminal". From then on it listens on the
  team channel "OOCSI-things/team7" for messages from the ESP32 in the
  suitcase, which runs DCE_Morse.ino.

  The puzzle works like this. The first time someone presses the red
  Morse button, the terminal switches off and the Lampo screen takes
  over: a wall with a hole in it and a lamp behind it. The lamp is on
  while the button is held and off when it is released, so the players
  see the Morse code as flashes of light through the hole. With the
  CLEAR button they go back to the terminal and type the code they
  decoded. The correct code unlocks the vault and sends the event
  "solved" on the team channel, so the other modules of the escape room
  can react to it.

  The page understands three messages from the suitcase. Every 10
  seconds the ESP32 says it is still online, and every press and
  release of the button is sent as a separate message:
    { module: "suitcase", event: "online", uptime_s: <seconds> }
    { module: "morse_button", state: "pressed", lampo_toggle: true }
    { module: "morse_button", state: "released", lampo_toggle: false, duration_ms: <ms> }
  The page itself sends two messages: one when it connects and one
  when the passcode is correct:
    { module: "terminal", event: "online", team: 7 }
    { module: "terminal", event: "solved", team: 7 }

  Everything the page needs, including the wall picture, is inside this
  one file, so nothing else has to be uploaded.

  IMPORTANT! If you want the page to fit the aesthetics of your own
  escape room, edit the CSS styling code between lines 57 and 226
  (inside <style> ... </style>). The CSS only changes how the page
  looks; the OOCSI connection and the puzzle logic are in the
  JavaScript and keep working as they are.
-->
<head>
  <meta charset="UTF-8">
  <!-- viewport: makes the page fit phones and tablets. Without it, a phone pretends
       to be a wide desktop screen and shrinks everything to tiny. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Heist // Team 7 terminal</title>

  <!-- OOCSI libraries, hosted by TU/e -->
  <script src="https://oocsi.id.tue.nl/assets/js/p5.min.js"></script>              <!-- p5.js, required by OOCSI Things -->
  <script src="https://oocsi.id.tue.nl/assets/js/oocsi-web.js"></script>            <!-- OOCSI connection -->
  <script src="https://oocsi.id.tue.nl/assets/js/things/oocsi-things.min.js"></script> <!-- OOCSI Things (teamspaces) -->

  <style>
    /* =================================================================
       STYLING (CSS): lines 57 to 226
       This is where the look of the page is set. Edit it to match the
       aesthetics of your escape room; only the appearance changes, the
       page keeps working the same way. The map below shows where each
       part is, and the colours are the easiest place to start.

         Lines 73-81     Colours: change these first, they are used everywhere
         Lines 83-103    Page: font, background, scanline and glow effects
         Lines 105-159   Terminal: header, status boxes, passcode entry, success screen
         Lines 161-199   Lampo screen: wall picture, lamp colour, light glow
         Lines 201-219   Animation between terminal and Lampo
         Lines 221-225   Small screens and reduced motion
       ================================================================= */

    /* ---------- Colours ---------- */
    :root {
      --green: #00ff66;
      --green-dim: #0b6b33;
      --green-dark: #032a14;
      --red: #ff3b3b;
      --amber: #ffb000;
      --bg: #050805;
    }

    /* ---------- Page ---------- */
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: 'Courier New', Courier, monospace;
      background: var(--bg);
      color: var(--green);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    /* Hide what OOCSI Things adds to the page: the team selection dialog
       (the team is set in the script) and its "team7: icon" status line */
    #team-modal, #header { display: none !important; }

    /* horizontal lines over the whole screen, like an old monitor */
    .scanlines {
      position: fixed; inset: 0; pointer-events: none; z-index: 50;
      background: linear-gradient(to bottom, rgba(255,255,255,0) 50%, rgba(0,0,0,0.22) 50%);
      background-size: 100% 4px;
    }
    .glow { text-shadow: 0 0 5px var(--green), 0 0 10px var(--green); }

    /* ---------- Terminal (full screen) ---------- */
    #main {
      width: 100vw; height: 100vh; height: 100dvh;
      padding: clamp(18px, 4vh, 48px) clamp(18px, 5vw, 80px);
      background: rgba(0,0,0,0.8);
      box-shadow: inset 0 0 120px rgba(0,255,100,0.08);
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    header {
      display: flex; justify-content: space-between; align-items: center; gap: 16px;
      border-bottom: 1px solid var(--green-dim); padding-bottom: 14px; margin-bottom: 18px;
    }
    h1 { font-size: clamp(1.2rem, 2.6vw, 2.4rem); letter-spacing: 0.15em; margin: 0; }

    /* RX light: red while the Morse button is held */
    .rx { display: flex; align-items: center; gap: 8px; border: 1px solid #333; padding: 4px 10px; font-size: 0.8rem; }
    .dot { width: 14px; height: 14px; border-radius: 50%; background: #330000; box-shadow: inset 0 0 4px #000; transition: all 60ms; }
    .dot.on { background: var(--red); box-shadow: 0 0 12px var(--red), 0 0 24px var(--red); }

    /* Status boxes: terminal, suitcase ESP32, Lampo */
    #modules { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
    .module { border: 1px solid var(--green-dark); padding: 10px; font-size: 0.8rem; }
    .module b { display: block; font-size: 0.9rem; margin-bottom: 4px; }
    .state-live { color: var(--green); }
    .state-off  { color: #666; }
    .state-wait { color: var(--amber); }
    .error { color: var(--red); text-shadow: 0 0 5px var(--red); }

    /* Passcode entry, centred in the free space */
    #input-section {
      flex: 1; display: flex; flex-direction: column; justify-content: center;
      text-align: center; padding-bottom: 6vh;
    }
    label { display: block; letter-spacing: 0.1em; font-size: clamp(1.1rem, 2vw, 1.8rem); margin-bottom: 3vh; }
    .row { display: flex; gap: 12px; width: min(640px, 100%); margin: 0 auto; }
    input {
      flex: 1; min-width: 0; background: transparent; border: 2px solid var(--green-dim); color: var(--green);
      font: inherit; font-size: clamp(1.5rem, 3vw, 2.6rem); padding: 16px;
      text-align: center; letter-spacing: 0.3em; text-transform: uppercase; outline: none;
    }
    input:focus { border-color: var(--green); box-shadow: 0 0 10px rgba(0,255,100,0.4); }
    button {
      background: var(--green-dark); border: 2px solid var(--green-dim); color: var(--green);
      font: inherit; font-weight: bold; cursor: pointer;
      padding: 0 clamp(18px, 2.5vw, 40px); font-size: clamp(1rem, 1.6vw, 1.4rem);
    }
    button:hover, button:focus-visible { background: var(--green-dim); outline: none; }
    #feedback { height: 1.4em; font-size: 0.85rem; margin-top: 8px; text-align: center; }

    /* Shown after the correct passcode */
    #success { display: none; flex: 1; flex-direction: column; justify-content: center; text-align: center; padding-bottom: 6vh; }
    #success h2 { font-size: clamp(2.6rem, 7vw, 6rem); margin: 0 0 10px; }
    .flash { animation: flash 2s forwards; }
    @keyframes flash { 10%{background:#003300} 20%{background:var(--bg)} 30%{background:#005500} 100%{background:var(--bg)} }

    /* ---------- Lampo screen ----------
       Do not edit this part unless you want to change how the Lampo
       feature itself works. It is ready to use as it is.

       Only want a different picture? Leave this CSS alone and change the
       picture in the <img id="wall"> tag, line 273: replace the text in
       src="..." with the file name of your picture (uploaded to the same
       Data Foundry dataset, e.g. src="my-wall.png") or its web address.
       Your picture must have a TRANSPARENT hole (PNG or WebP), otherwise
       the light cannot shine through. If its shape or hole position
       differs from the current one (500 x 360, hole at 50.8% 47.6%),
       also update aspect-ratio in #scene and the position in #spill.  */
    #lampo-screen { position: fixed; inset: 0; z-index: 40; background: #000; display: none; }
    #lampo-screen.shown { display: block; }

    #scene {
      position: absolute; left: 50%; top: 50%;
      width: max(100vw, calc(100vh * 500 / 360));
      aspect-ratio: 500 / 360;
      transform: translate(-50%, -50%);
      overflow: hidden;
    }
    #lamp { position: absolute; inset: 0; background: #0a0a0a; }
    #lamp.on { background: #fff8e8; }
    #wall {
      position: absolute; inset: 0; width: 100%; height: 100%; display: block;
      filter: brightness(0.32) contrast(1.1);
      user-select: none; pointer-events: none;
    }
    #lamp.on ~ #wall { filter: brightness(0.62) contrast(1.05); }
    #spill {
      position: absolute; inset: 0; pointer-events: none; opacity: 0;
      background: radial-gradient(circle at 50.8% 47.6%,
                  rgba(255,246,220,0.55) 0%, rgba(255,240,200,0.18) 14%, rgba(255,240,200,0) 32%);
      mix-blend-mode: screen;
    }
    #lamp.on ~ #spill { opacity: 1; }

    #clear-msg  { position: absolute; right: 24px; bottom: 20px; z-index: 2; padding: 8px 22px; background: rgba(3,42,20,0.85); }

    /* ---------- Switching between terminal and Lampo ----------
       Terminal switches off like an old CRT screen (shrinks to a line),
       Lampo flickers on. CLEAR plays it the other way round.          */
    #main.crt-off  { animation: crtOff 420ms ease-in forwards; }
    #main.crt-on   { animation: crtOn  420ms ease-out; }
    #lampo-screen.power-on  { animation: powerOn  520ms ease-out; }
    #lampo-screen.power-off { animation: powerOff 380ms ease-in forwards; }
    @keyframes crtOff {
      0%   { transform: scale(1, 1);    filter: brightness(1); opacity: 1; }
      55%  { transform: scale(1, 0.01); filter: brightness(3); opacity: 1; }
      100% { transform: scale(0, 0.01); filter: brightness(5); opacity: 0; }
    }
    @keyframes crtOn {
      0%   { transform: scale(0, 0.01); filter: brightness(5); opacity: 0; }
      45%  { transform: scale(1, 0.01); filter: brightness(3); opacity: 1; }
      100% { transform: scale(1, 1);    filter: brightness(1); opacity: 1; }
    }
    @keyframes powerOn  { 0% { opacity: 0; } 40% { opacity: 0; } 60% { opacity: 0.6; } 70% { opacity: 0.2; } 100% { opacity: 1; } }
    @keyframes powerOff { from { opacity: 1; } to { opacity: 0; } }

    /* ---------- Small screens and reduced motion ---------- */
    @media (max-width: 560px) { #modules { grid-template-columns: 1fr; } }
    @media (prefers-reduced-motion: reduce) {
      .flash, #main.crt-off, #main.crt-on, #lampo-screen.power-on, #lampo-screen.power-off { animation-duration: 1ms; }
    }
  </style>
</head>

<body>
  <div class="scanlines"></div>

  <!-- ===================== TERMINAL ===================== -->
  <div id="main">
    <header>
      <!-- heading shown on screen: change this text for your own escape room -->
      <h1 class="glow">THE HEIST // SYSTEM OVERRIDE</h1>
      <div class="rx" title="Lights up while the red Morse button is held">
        <span>RX</span><div id="rx-dot" class="dot"></div>
      </div>
    </header>

    <!-- status of each part of the module -->
    <div id="modules">
      <div class="module"><b>Terminal</b><span id="st-terminal" class="state-wait">Connecting...</span></div>
      <div class="module"><b>Suitcase ESP32</b><span id="st-suitcase" class="state-off">Not seen yet</span></div>
      <div class="module"><b>Lampo</b><span id="st-lampo" class="state-live">Ready: shows on first press</span></div>
    </div>

    <!-- passcode entry -->
    <div id="input-section">
      <label class="glow" for="code">Enter decrypted passcode</label>
      <div class="row">
        <input id="code" type="text" autocomplete="off" spellcheck="false" placeholder="____">
        <button id="verify">VERIFY</button>
      </div>
      <p id="feedback"></p>
    </div>

    <!-- replaces the passcode entry once the code is correct -->
    <div id="success">
      <h2 class="glow">VAULT UNLOCKED</h2>
      <p>Team 7 access granted. Signal sent on the team channel.</p>
    </div>
  </div>

<script>
  // =====================================================
  // SETTINGS
  // This module was made for team 7, but any team can use it in their
  // own escape room. To do so, set TEAM_NUMBER to your own team number;
  // the teamspace and the channel ("OOCSI-things/team" + your number)
  // are built from it automatically. Then change CORRECT_PASSCODE to the
  // code your players have to decode. The ESP32 must talk on the same
  // channel, so change teamChannel in DCE_Morse.ino as well, otherwise
  // the page and the suitcase will not hear each other. To make the page
  // fit your story, change the visible texts in the HTML (the tab name in
  // <title>, the heading in <h1> and the "VAULT UNLOCKED" message) and
  // adapt the look in the CSS, explained under "STYLING" in <style>.
  // Everything below these settings can stay as it is, as long as the
  // ESP32 runs DCE_Morse.ino with the same button and messages. If you
  // use a different device or message format, you will need to adapt
  // onTeamMessage() (line 379) so the page understands your messages.
  // =====================================================
  const TEAM_NUMBER = 7;
  const TEAM = "team" + TEAM_NUMBER;
  const TEAM_CHANNEL = "OOCSI-things/" + TEAM;
  const CORRECT_PASSCODE = "2026";
  const SUITCASE_TIMEOUT_MS = 25000;   // suitcase counts as lost after 25 s without a message (it sends one every 10 s)
  const SWAP_MS = 420;                 // length of the terminal -> Lampo animation

  // Join your team's teamspace directly, without the team selection dialog
  oocsiThingsConfig = { teamspace: TEAM };

  // ---------- State ----------
  let connected = false;         // true once OOCSI is connected
  let lastSuitcaseSeen = 0;      // time of the last message from the ESP32
  let solvedData = null;         // OOCSI Things output "solved"
  let lampData = null;           // OOCSI Things output "lamp"
  let lampoShown = false;        // true while the Lampo screen is on
  let swapping = false;          // true during the swap animation
  let solved = false;            // true after the correct passcode

  // p5.js needs a setup() function to start; this page draws nothing with p5
  function setup() { noCanvas(); }

  // =====================================================
  // OOCSI THINGS
  // Called automatically by OOCSI Things once the page is connected.
  // Registers this page as a Thing in your team's teamspace:
  //   input:   toggle (registered, not used by this page)
  //   outputs: solved (true after the correct passcode)
  //            lamp   (true while the lamp is on)
  // Other teams can connect to "heist-terminal" outputs in their own Things.
  // =====================================================
  function thing() {
    oocsiThings.register('H', 'heist-terminal', ['toggle'], ['solved', 'lamp']);
    solvedData = oocsiThings.data('solved');
    solvedData(false);
    lampData = oocsiThings.data('lamp');
    lampData(false);

    OOCSI.subscribe(TEAM_CHANNEL, onTeamMessage);

    connected = true;
    setState('st-terminal', 'Live on ' + TEAM_CHANNEL, 'state-live');
    log('Connected to team channel ' + TEAM_CHANNEL);

    OOCSI.send(TEAM_CHANNEL, { module: 'terminal', event: 'online', team: TEAM_NUMBER });
  }

  // =====================================================
  // KEEP THE PAGE CLEAN
  // OOCSI Things adds a status line ("team7: icon") to the page and
  // renames the browser tab. This removes the status line and keeps
  // the tab title below, whenever the library changes them.
  // =====================================================
  const PAGE_TITLE = document.title;   // the text in <title>, saved before the library changes it
  const OWN_PARTS = ['main', 'lampo-screen'];

  function keepPageClean() {
    if (document.title !== PAGE_TITLE) document.title = PAGE_TITLE;
    for (const el of document.body.children) {
      if (el.tagName === 'SCRIPT' || el.classList.contains('scanlines')) continue;
      if (OWN_PARTS.some(id => el.id === id || el.querySelector('#' + id))) continue;
      el.style.display = 'none';
    }
  }
  new MutationObserver(keepPageClean).observe(document.documentElement, { childList: true, subtree: true, characterData: true });
  keepPageClean();

  // If there is still no connection after 8 s, show the likely cause
  setTimeout(() => {
    if (connected) return;
    if (typeof OOCSI === 'undefined' || typeof oocsiThings === 'undefined') {
      setState('st-terminal', 'Offline: OOCSI scripts blocked', 'error');
      log('OOCSI scripts did not load. Open the page from its Data Foundry link.');
    } else {
      setState('st-terminal', 'Offline: server not reached', 'error');
      log('Scripts loaded but no OOCSI connection. Check the internet connection and reload.');
    }
  }, 8000);

  // =====================================================
  // INCOMING MESSAGES on the team channel
  // =====================================================
  function onTeamMessage(msg) {
    const d = msg.data || {};
    if (!d.module) return;   // messages without "module" are OOCSI Things' own sync messages

    switch (d.module) {
      case 'suitcase':       // heartbeat from the ESP32
        markSuitcaseSeen();
        if (d.event === 'online') log('Suitcase online (uptime ' + (d.uptime_s ?? '?') + ' s)');
        break;

      case 'morse_button': { // red button pressed or released
        markSuitcaseSeen();
        const on = (typeof d.lampo_toggle === 'boolean') ? d.lampo_toggle : d.state === 'pressed';
        document.getElementById('rx-dot').classList.toggle('on', on);
        setLamp(on);
        if (on && !lampoShown && !solved) showLampo();   // first press: Lampo takes over the screen
        break;
      }

      case 'terminal':       // our own messages (and those of other open terminals)
        log('Terminal: ' + d.event);
        break;

      default:               // messages from other modules on the channel
        log(d.module + ': ' + JSON.stringify(d));
    }
  }

  function markSuitcaseSeen() {
    lastSuitcaseSeen = Date.now();
    setState('st-suitcase', 'Live', 'state-live');
  }

  // Every 2 s: check whether the suitcase has gone quiet
  setInterval(() => {
    if (lastSuitcaseSeen && Date.now() - lastSuitcaseSeen > SUITCASE_TIMEOUT_MS) {
      setState('st-suitcase', 'Lost: check ESP power / Wi-Fi', 'error');
    }
  }, 2000);

  // =====================================================
  // LAMPO
  // =====================================================

  // Lamp on or off. No transition, so short and long presses stay clearly visible.
  function setLamp(on) {
    document.getElementById('lamp').classList.toggle('on', on);
    if (lampData) lampData(on);
  }

  // Terminal switches off, Lampo screen switches on
  function showLampo() {
    if (swapping) return;
    lampoShown = true;
    swapping = true;
    const main = document.getElementById('main');
    const screen = document.getElementById('lampo-screen');

    main.classList.remove('crt-on');
    main.classList.add('crt-off');
    screen.classList.remove('power-off');
    screen.classList.add('shown', 'power-on');
    screen.removeAttribute('aria-hidden');
    setState('st-lampo', 'On screen: receiving', 'state-live');
    log('Signal detected. Lampo on screen.');

    // after the animation, hide the terminal completely
    setTimeout(() => {
      main.style.visibility = 'hidden';
      screen.classList.remove('power-on');
      swapping = false;
    }, SWAP_MS + 100);
  }

  // CLEAR button: Lampo fades out, terminal switches back on
  function clearMessage() {
    if (!lampoShown || swapping) return;
    swapping = true;
    setLamp(false);
    const main = document.getElementById('main');
    const screen = document.getElementById('lampo-screen');

    screen.classList.add('power-off');
    setTimeout(() => {
      screen.classList.remove('shown', 'power-off');
      screen.setAttribute('aria-hidden', 'true');
      main.style.visibility = '';
      main.classList.remove('crt-off');
      main.classList.add('crt-on');
      lampoShown = false;
      swapping = false;
      setState('st-lampo', 'Ready: shows on next press', 'state-live');
      log('Message cleared.');
      document.getElementById('code').focus();
    }, 380);
  }

  // =====================================================
  // PASSCODE
  // =====================================================
  function checkPasscode() {
    const input = document.getElementById('code');
    const feedback = document.getElementById('feedback');
    const attempt = input.value.trim().toUpperCase();

    if (attempt === CORRECT_PASSCODE) {
      solved = true;
      log('Passcode accepted. Vault unlocked.');
      document.getElementById('input-section').style.display = 'none';
      document.getElementById('success').style.display = 'flex';
      document.body.classList.add('flash');

      // tell the rest of the escape room
      if (connected) {
        OOCSI.send(TEAM_CHANNEL, { module: 'terminal', event: 'solved', team: TEAM_NUMBER });
        if (solvedData) solvedData(true);
      }
    } else {
      log("Wrong passcode '" + attempt + "'");
      feedback.textContent = attempt ? 'Wrong code. Decode the signal again.' : 'Type the code first.';
      feedback.className = 'error';
      input.value = '';
      setTimeout(() => { feedback.textContent = ''; feedback.className = ''; }, 2000);
    }
  }

  // =====================================================
  // BUTTONS AND ENTER KEY
  // OOCSI Things can rebuild the page after it loads, which removes
  // click listeners attached to single elements. The listeners are
  // therefore attached to the whole document, and a click is matched
  // to a button by its position on the screen.
  // =====================================================
  function isClickOn(id, e) {
    const el = document.getElementById(id);
    if (!el) return false;
    if (id === 'verify' && lampoShown) return false;      // VERIFY is hidden behind Lampo
    if (id === 'clear-msg' && !lampoShown) return false;  // CLEAR only exists on the Lampo screen
    if (e.detail === 0) return el.contains(e.target);     // "click" made with the keyboard
    const r = el.getBoundingClientRect();
    return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
  }

  document.addEventListener('click', e => {
    if (isClickOn('clear-msg', e)) clearMessage();
    else if (isClickOn('verify', e)) checkPasscode();
  }, true);

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.id === 'code') { e.preventDefault(); checkPasscode(); }
  }, true);

  // =====================================================
  // HELPERS
  // =====================================================

  // Messages for testing; open with F12 > Console
  function log(text) {
    console.log('[Heist] ' + text);
  }

  // Update one of the three status boxes
  function setState(id, text, cls) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = cls;
  }
</script>
</body>
